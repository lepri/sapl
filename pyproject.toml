[project]
name = "sapl"
version = "3.1.163"
description = "Sistema de Apoio ao Processo Legislativo"
readme = "README.rst"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "django==2.2.28",
    "django-haystack==3.1.1",
    "django-filter==2.4.0",
    "djangorestframework==3.12.4",
    "django-braces==1.14.0",
    "django-crispy-forms==1.7.2",
    "django-contrib-postgres==0.0.1",
    "django-extra-views==0.12.0",
    "django-model-utils==3.1.2",
    "django-extensions==2.1.4",
    "django-image-cropping==1.2",
    "django-tenants==3.8.0",
    "django-waffle==3.0.0",
    "django-webpack-loader==1.6.0",
    "drf-spectacular==0.18.2",
    "django-ratelimit==3.0.1",
    "easy-thumbnails==2.8.5",
    "python-decouple==3.1",
    "dj-database-url==0.5.0",
    "psycopg2-binary==2.9.9",
    "pyyaml==6.0.1",
    "pytz==2019.3",
    "python-magic==0.4.15",
    "unipath==1.1",
    "Pillow==10.3.0",
    "reportlab==3.6.13",
    "WeasyPrint==66",
    "trml2pdf==0.6",
    "gunicorn==23.0.0",
    "more-itertools==8.2.0",
    "pysolr==3.6.0",
    "PyPDF4==1.27.0",
    "pyoai",
    "Unidecode==1.1.1",
    "whitenoise==5.1.0",
    "kazoo==2.8.0",
    "django-prometheus==2.2.0",
    "asn1crypto==1.5.1",
    "XlsxWriter==3.2.0",
    "django-admin-bootstrapped",
    # pkg_resources foi removido no setuptools 81 (mesmo pin do Dockerfile)
    "setuptools<81",
]

[dependency-groups]
test = [
    "coverage==7.6.1",
    "django-webtest==1.9.8",
    "flake8==7.1.1",
    "isort==5.13.2",
    "model-bakery==1.5.0",
    "pycodestyle==2.12.1",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "WebTest==3.0.6",
]
dev = [
    { include-group = "test" },
    "autopep8==2.3.2",
    "beautifulsoup4==4.13.5",
    "django-debug-toolbar==3.2.4",
    "ipdb==0.13.13",
    "fancycompleter==0.11.1",
    "pdbpp==0.11.7",
    "pip-review==1.3.0",
    "pipdeptree==2.28.0",
]
migration = [
    { include-group = "dev" },
    "GitPython",
    "mysqlclient==1.3.12",
    "pyaml",
    "texttable",
]

[tool.uv]
default-groups = ["dev"]
# Django 2.2 e várias libs antigas não declaram metadados compatíveis com
# resolução estrita; mantém o comportamento do pip original.
package = false

[tool.uv.sources]
pyoai = { git = "https://github.com/infrae/pyoai", rev = "5ff2f15e869869e70d8139e4c37b7832854d7049" }
django-admin-bootstrapped = { git = "https://github.com/interlegis/django-admin-bootstrapped" }
